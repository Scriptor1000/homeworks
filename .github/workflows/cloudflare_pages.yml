name: Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .flutter-plugins
            .flutter-plugins-dependencies
          key: ${{ runner.os }}-flutter-dependencies-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-dependencies
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run build runner
        run: dart run build_runner build

      - name: Run tests
        run: flutter test

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env: 
      SENTRY_RELEASE: ${{ github.ref_name }}@${{ github.sha }}
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .flutter-plugins
            .flutter-plugins-dependencies
          key: ${{ runner.os }}-flutter-dependencies-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-dependencies
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run build runner
        run: dart run build_runner build

      - name: Install Sentry CLI
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Build web
        run: flutter build web --release --source-maps --dart-define=SENTRY_RELEASE=${{ env.SENTRY_RELEASE }}
      
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --commit-dirty=true

      - name: Upload Sourcemap to Sentry
        env:
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
            SENTRY_ORG: max-uf
            SENTRY_PROJECT: homeworks
        run: |
          sentry-cli releases new "${{ env.SENTRY_RELEASE }}"
          sentry-cli sourcemaps upload --release=${{ env.SENTRY_RELEASE }} build/web
          sentry-cli releases finalize "${{ env.SENTRY_RELEASE }}"

      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployUrl = '${{ steps.deploy.outputs.deployment-url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Preview successfully deployed!\n\nView it [here](${deployUrl}).`
            });
            console.log('Comment with preview URL added to PR');