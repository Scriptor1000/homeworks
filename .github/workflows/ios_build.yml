name: IOS Build

on: push # To test this workflow, run on every push.defaults:
# CHANGE THIS BEFORE MERGING TO MAIN BRANCH

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: false # To test this workflow, do not run tests. REMOVE THIS LINE BEFORE MERGING TO MAIN BRANCH
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .flutter-plugins
            .flutter-plugins-dependencies
          key: ${{ runner.os }}-flutter-dependencies-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-dependencies
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run build runner
        run: dart run build_runner build

      - name: Run tests
        run: flutter test
    
  build:
    name: Build iOS App
    # needs: test # do not wait for test when testing this workflow
    # CHANGE THIS LINE BEFORE MERGING TO MAIN BRANCH 
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      
      - name: Install dependencies
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .flutter-plugins
            .flutter-plugins-dependencies
          key: ${{ runner.os }}-flutter-dependencies-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-dependencies
      
      - name: Flutter Setup
        if: false # To test this workflow, do not run long setup commands. REMOVE THIS LINE BEFORE MERGING TO MAIN BRANCH
        run: |
            dart run build_runner build
            dart run flutter_launcher_icons
            dart run flutter_native_splash:create

      - name: Restore iOS signing files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PRIVATE_KEY_BASE64: ${{ secrets.IOS_PRIVATE_KEY_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo -n "$IOS_CERTIFICATE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/distribution.cer"

          echo -n "$IOS_PRIVATE_KEY_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/distribution.key"

          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          openssl x509 \
            -inform DER \
            -in "$RUNNER_TEMP/distribution.cer" \
            -out "$RUNNER_TEMP/distribution.pem"

          openssl pkcs12 -export \
            -inkey "$RUNNER_TEMP/distribution.key" \
            -in "$RUNNER_TEMP/distribution.pem" \
            -out "$RUNNER_TEMP/distribution.p12" \
            -passout env:IOS_P12_PASSWORD

      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.12
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane
        

      - name: Build signed iOS IPA
        env:
          IOS_P12_PATH: ${{ runner.temp }}/distribution.p12
          IOS_PROFILE_PATH: ${{ runner.temp }}/profile.mobileprovision
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME }}
        run: |
          cd ios
          bundle exec fastlane ios build_adhoc

      - name: Upload IPA as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-adhoc
          path: build/ios/ipa/app.ipa

