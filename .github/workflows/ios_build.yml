name: IOS Build

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-ios:
    name: Deploy iOS App
    needs: test 
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true     
          
      - name: Dependencies Cache
        uses: actions/cache@v4
        id: flutter-deps-cache
        with:
          path: |
            ~/.pub-cache
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            .dart_tool
            .flutter-plugins
            .flutter-plugins-dependencies
          key: ${{ runner.os }}-flutter-dependencies-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-dependencies
      
      - name: Prepare Flutter for iOS build
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            flutter build ios --config-only --no-codesign --build-number="${GITHUB_RUN_NUMBER}" --build-name="${GITHUB_REF_NAME#v}"
          else
            flutter build ios --config-only --no-codesign --build-number="${GITHUB_RUN_NUMBER}"
          fi

          dart run build_runner build
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Setup signing file env
        run: |          
          echo "IOS_P12_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "IOS_P12_PATH=$RUNNER_TEMP/distribution.p12" >> "$GITHUB_ENV"
          echo "IOS_ADHOC_PROFILE_PATH=$RUNNER_TEMP/adhoc.mobileprovision" >> "$GITHUB_ENV"
          echo "IOS_TESTFLIGHT_PROFILE_PATH=$RUNNER_TEMP/testflight.mobileprovision" >> "$GITHUB_ENV"
          echo "FIREBASE_SERVICE_CREDENTIALS_FILE_PATH=$RUNNER_TEMP/firebase-service-credentials.json" >> "$GITHUB_ENV"

      - name: Restore iOS signing files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PRIVATE_KEY_BASE64: ${{ secrets.IOS_PRIVATE_KEY_BASE64 }}
          IOS_ADHOC_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_ADHOC_BASE64 }}
          IOS_TESTFLIGHT_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_TESTFLIGHT_BASE64 }}
          FIREBASE_SERVICE_CREDENTIALS_CONTENT: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS_CONTENT }}
        run: |
          echo "Decoding iOS signing files ..."
          echo -n "$IOS_CERTIFICATE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/distribution.cer"

          echo -n "$IOS_PRIVATE_KEY_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/distribution.key"

          echo -n "$IOS_ADHOC_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode > "$IOS_ADHOC_PROFILE_PATH"

          echo -n "$IOS_TESTFLIGHT_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode > "$IOS_TESTFLIGHT_PROFILE_PATH"

          echo -n "$FIREBASE_SERVICE_CREDENTIALS_CONTENT" > "$FIREBASE_SERVICE_CREDENTIALS_FILE_PATH"
          
          echo "Creating P12 file from certificate and private key ..."
          openssl x509 \
            -inform DER \
            -in "$RUNNER_TEMP/distribution.cer" \
            -out "$RUNNER_TEMP/distribution.pem"

          openssl pkcs12 -export \
            -legacy \
            -inkey "$RUNNER_TEMP/distribution.key" \
            -in "$RUNNER_TEMP/distribution.pem" \
            -out "$IOS_P12_PATH" \
            -passout env:IOS_P12_PASSWORD
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.12
          bundler-cache: true

      - name: Install Fastlane
        run: |
          cd ios
          gem install fastlane        
          bundle exec fastlane add_plugin firebase_app_distribution --non_interactive

      - name: Deploy signed iOS IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_ADHOC_PROFILE_NAME: ${{ vars.IOS_ADHOC_PROFILE_NAME }}
          IOS_TESTFLIGHT_PROFILE_NAME: ${{ vars.IOS_TESTFLIGHT_PROFILE_NAME }}

          FIREBASE_APP_ID: ${{ vars.IOS_APP_ID }}

          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios          
          bundle exec fastlane ios build adhoc:true testflight:${{ github.ref_type == 'tag' && 'true' || 'false' }}

  build-android:
    name: Deploy Android App
    needs: test 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true     
          
      - name: Dependencies Cache
        uses: actions/cache@v4
        id: flutter-deps-cache
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .flutter-plugins
            .flutter-plugins-dependencies
          key: ${{ runner.os }}-flutter-dependencies-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-dependencies

      - name: Prepare Flutter for Android build
        run: |
          flutter pub get
          dart run build_runner build
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Restore Android signing files
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ vars.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed Android APK
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            flutter build apk --release --build-number="${GITHUB_RUN_NUMBER}" --build-name="${GITHUB_REF_NAME#v}"
          else
            flutter build apk --release --build-number="${GITHUB_RUN_NUMBER}"
          fi

      - name: Upload APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ vars.ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS_CONTENT }}
          groups: ${{ github.ref_type == 'tag' && 'all' || 'internal' }}
          file: build/app/outputs/flutter-apk/app-release.apk