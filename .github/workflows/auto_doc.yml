name: Automated Documentation Generation
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-docs:
    name: Generate & Deploy Documentation
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v5

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.x'

        - name: Set up Flutter
          uses: subosito/flutter-action@v2
          with:
            channel: stable
            flutter-version-file: pubspec.yaml
            cache: true

        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r tools/requirements.txt

        - name: Generate Documentation as TeX
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            cd tools
            python build_history.py

        - name: Setup LaTeX Environment
          uses: wtfjoke/setup-tectonic@v4
          
        - name: Generate PDF from TeX
          run: |
            cd tools
            tectonic output.tex

        - name: Generate Dart Documentation
          run: |
            flutter pub get
            dart run build_runner build
            dart run index_generator build
            dart run dartdoc --output=build/online/doc

        - name: Copy content to publish folder
          run: |
            mv tools/output.pdf build/online/report.pdf
            mv tools/page/* build/online

        - name: Deploy to Cloudflare Pages
          id: deploy
          uses: cloudflare/wrangler-action@v3
          with: 
            apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            command: pages deploy build/online --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --commit-dirty=true --branch=main